name: Build Windows setup.exe

on:
  workflow_dispatch:
    inputs:
      commit_installer:
        description: "Commit install/setup.exe back to this branch"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-windows-installer.yml"
      - "src/**"
      - "scripts/build_windows_exe.py"
      - "scripts/build_windows_installer.py"
      - "installer/windows/trino-excel-client.iss"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Install Python dependencies
        run: python -m pip install -e ".[test,package]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build PyInstaller executables
        run: python scripts\build_windows_exe.py --clean

      - name: Build setup.exe
        run: python scripts\build_windows_installer.py --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: setup.exe
          path: install/setup.exe

      - name: Commit setup.exe
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.commit_installer == 'true')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f install/setup.exe
          if (git diff --cached --quiet) {
            Write-Host "install/setup.exe is unchanged"
          } else {
            git commit -m "Build Windows setup.exe"
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push
          }

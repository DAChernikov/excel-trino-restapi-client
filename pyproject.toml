[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trino-excel-client"
version = "0.2.0"
description = "Excel Power Query client generator for Trino REST API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.0.10",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
trino-excel-client = "trino_excel_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
